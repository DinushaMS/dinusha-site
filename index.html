<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dinusha M. Senarathna, PhD</title>
  <meta name="description" content="Experimental physicist specializing in ultrafast nonlinear optical spectroscopy and light–matter interactions.">
  <meta property="og:title" content="Dinusha M. Senarathna, PhD">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="nav" id="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="logo" aria-label="Home">DS</a>
      <nav aria-label="Primary">
        <ul class="links" id="links">
          <li><a href="#about">About</a></li>
          <li><a href="#research">Research</a></li>
          <li><a href="#education">Education</a></li>
          <li><a href="#employment">Experience</a></li>
          <li><a href="#publications">Publications</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="theme" aria-label="Toggle dark mode" title="Toggle theme">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn menu-btn" id="menu" aria-label="Menu" aria-expanded="false" aria-controls="links">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- Hero -->
    <section class="hero" id="top">
      <div class="wrap hero-grid">
        <div class="hero-text">
          <p class="eyebrow" id="role"></p>
          <h1 id="name"></h1>
          <p class="tagline" id="tagline"></p>
          <div class="chips" id="keywords"></div>
          <div class="cta">
            <a class="btn primary" href="#research">Explore research</a>
            <a class="btn" href="#contact">Get in touch</a>
          </div>
        </div>
        <div class="hero-visual">
          <img class="beams" src="images\laser_1.jpg" alt="CARS experimental setup" loading="lazy">
        </div>
      </div>
    </section>

    <!-- About -->
    <section class="section" id="about">
      <div class="wrap about-grid">
        <figure class="portrait reveal">
          <img id="photo" alt="Portrait of Dinusha M. Senarathna" loading="lazy">
        </figure>
        <div class="reveal">
          <h2 class="h2">About</h2>
          <p class="lead" id="bio"></p>
        </div>
      </div>
    </section>

    <!-- Research -->
    <section class="section alt" id="research">
      <div class="wrap">
        <h2 class="h2 reveal">Research</h2>
        <div class="cards" id="research-cards"></div>
      </div>
    </section>

    <!-- Education -->
    <section class="section" id="education">
      <div class="wrap">
        <h2 class="h2 reveal">Education</h2>
        <ol class="timeline" id="education-list"></ol>
      </div>
    </section>

    <!-- Employment -->
    <section class="section alt" id="employment">
      <div class="wrap">
        <h2 class="h2 reveal">Experience</h2>
        <ol class="timeline" id="employment-list"></ol>
      </div>
    </section>

    <!-- Publications -->
    <section class="section" id="publications">
      <div class="wrap">
        <h2 class="h2 reveal">Publications</h2>
        <ul class="pubs" id="pub-list"></ul>
      </div>
    </section>

    <!-- Contact -->
    <section class="section alt" id="contact">
      <div class="wrap contact reveal">
        <h2 class="h2">Contact</h2>
        <div id="contact-body"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">&copy; <span id="year"></span> <span id="foot-name"></span></div>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
